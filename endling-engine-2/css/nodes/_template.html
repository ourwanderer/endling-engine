<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE ENDLING SAGA — [NODE NAME]</title>
  <link rel="stylesheet" href="../css/engine.css">
</head>
<body>

<div id="page-transition" class="page-transition"></div>

<div class="site-logo">
  <a href="../index.html">THE ENDLING SAGA</a>
</div>

<!--
  ZONE CLASSES — add one to the <main> element to set the world colour:
  zone-newkyushu   (purple-black — New Kyushu, Koa's world)
  zone-continent   (green-black  — The Continent, High Wail Rook)
  zone-domum       (ochre-black  — Domum Novum, origin point)
  zone-engine      (red-black    — The Engine, Leonard's territory)
  [no class]       (pure void    — neutral / unknown / liminal)
-->

<main class="engine-page zone-CHANGEME">

  <!--
    BACKGROUND IMAGE
    Upload your image to the /images/ folder.
    Reference it here. Leave blank for text-only nodes.

    Options:
    A) Full bleed image behind content (default below)
    B) Text only — remove the bg-image div entirely, let the zone colour breathe
    C) Image AS content — use node-image inside .content instead
  -->

  <!-- OPTION A: Background image -->
  <div class="bg-image vignette" style="background-image: url('../images/YOURIMAGE.jpg')"></div>


  <div class="content">

    <!-- OPTIONAL: small label — world/category identifier -->
    <!-- <span class="node-label">NEW KYUSHU</span> -->

    <!-- Title: character name, location, object, concept -->
    <h2 class="node-title">NODE TITLE</h2>

    <!--
      Content: choose ONE of the following types and delete the others.

      TYPE 1: Prose / description (italic, atmospheric)
      TYPE 2: Fragment / text excerpt (mono, left-bordered)
      TYPE 3: Image as content (use when image IS the content, not just background)
    -->

    <!-- TYPE 1: Prose -->
    <p class="node-text">
      Atmospheric description goes here. One or two short paragraphs maximum.
      Less is more. Leave space for the visitor to wonder.
    </p>

    <!-- TYPE 2: Fragment (lyrics, lore entry, excerpt) -->
    <!--
    <p class="node-fragment">
      "Fragment text goes here.<br>
      Can be a lyric, a sentence from High Wail Rook,<br>
      a glossary entry, a character's spoken line."
    </p>
    -->

    <!-- TYPE 3: Image as content -->
    <!--
    <img class="node-image" src="../images/YOURIMAGE.jpg" alt="">
    <p class="node-text">
      Optional caption / lore fragment beneath the image.
    </p>
    -->

  </div>

</main>

<!-- Navigation — always present, always in the same position -->
<nav class="node-nav">
  <button id="btn-back" class="nav-btn">← go back</button>
  <button id="btn-deeper" class="nav-btn deeper">go deeper →</button>
</nav>

<!--
  COORDINATES (optional easter egg)
  Set data-coords to anything — a real coordinate, a date, a cryptic string.
  Visible only to people inspecting the page or squinting at the bottom right corner.
  Leave blank to hide entirely.
-->
<div class="coordinates" data-coords=""></div>

<script src="../js/engine.js"></script>
<script>
  // DEEPER DESTINATIONS FOR THIS NODE
  // List 3–6 pages this node connects to.
  // Assign weights: higher = more likely.
  // Thematic connections get higher weight.
  // Strange/oblique connections get weight 1 or 0.5.
  //
  // IMPORTANT: use relative paths from the /nodes/ folder.
  // Example: 'koa.html', 'leonard.html', '../nodes/agnar.html'

  initDeeperButton([
    { url: 'RELATED-NODE.html',  weight: 3 },
    { url: 'RELATED-NODE.html',  weight: 2 },
    { url: 'OBLIQUE-NODE.html',  weight: 1 },
  ]);
</script>

</body>
</html>

<!--
═══════════════════════════════════════════════════════
  QUICK GUIDE: BUILDING A NEW NODE

  1. Duplicate this file. Rename it (e.g. 'irla.html').
  2. Change <title> to the node name.
  3. Set zone class on <main>: zone-newkyushu / zone-continent / zone-domum / zone-engine
  4. Choose your content type (prose / fragment / image).
  5. Upload your image to /images/ and reference it.
  6. Fill in the initDeeperButton pool with 3–6 connected node filenames.
  7. Optionally set data-coords to a cryptic string.
  8. Done.

  NODE NAMING CONVENTIONS (keeps it manageable):
  Character nodes:    koa.html, leonard.html, doran.html, irla.html
  Location nodes:     new-kyushu.html, the-continent.html, high-wail.html
  Object/artefact:    agnar.html, sleipnir.html, acid-cola.html
  Concept/lore:       three-moons.html, dead-gods.html, holy-lines.html
  Fragment nodes:     fragment-001.html (lyrics, excerpts, etc.)
  Frozen instances:   frozen-nkmc.html, frozen-leonardgame.html
═══════════════════════════════════════════════════════
-->
