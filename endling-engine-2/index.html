<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Endling Saga. An Engine. Between states.">
  <meta name="robots" content="noindex">
  <title>THE ENDLING SAGA</title>
  <link rel="stylesheet" href="css/engine.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0608;
    }

    body::before, body::after { display: none; }

    .holding-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      text-align: center;
      gap: 1.8rem;
    }

    .holding-bg {
      position: absolute;
      inset: 0;
      background-image: url('/images/east-to-engine.jpg');
      background-size: cover;
      background-position: center;
      filter: brightness(0.35) saturate(0.7);
      z-index: 0;
    }

    .holding-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center,
        transparent 30%,
        rgba(10,6,8,0.6) 70%,
        rgba(10,6,8,0.95) 100%
      );
    }

    .holding-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
    }

    .holding-inscription {
      font-family: 'Space Mono', monospace;
      font-size: clamp(0.5rem, 1vw, 0.65rem);
      letter-spacing: 0.35em;
      color: #b8a090;
      opacity: 0.35;
      text-transform: uppercase;
      animation: fadeIn 2s ease 0.5s both;
    }

    .holding-logo {
      animation: fadeIn 1.5s ease 0.8s both;
      filter: drop-shadow(0 0 40px rgba(139, 26, 26, 0.3));
    }

    .holding-logo img {
      width: clamp(160px, 30vw, 320px);
      height: auto;
      filter: brightness(0) invert(1);
    }

    .holding-line {
      width: 1px;
      height: 50px;
      background: linear-gradient(to bottom, transparent, rgba(139,26,26,0.5), transparent);
      animation: fadeIn 1s ease 1.8s both;
    }

    .holding-status {
      font-family: 'Space Mono', monospace;
      font-size: clamp(0.5rem, 1vw, 0.62rem);
      letter-spacing: 0.3em;
      color: #c0392b;
      opacity: 0.7;
      text-transform: uppercase;
      animation: fadeIn 1s ease 1.5s both;
    }

    .holding-sub {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: clamp(0.75rem, 1.5vw, 0.9rem);
      color: rgba(232, 221, 208, 0.6);
      opacity: 0;
      animation: fadeIn 1.5s ease 2.2s forwards;
      max-width: 320px;
      line-height: 1.7;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono&family=IM+Fell+English:ital@1&display=swap" rel="stylesheet">
</head>
<body>

<div class="holding-wrap">
  <div class="holding-bg"></div>

  <div class="holding-content">
    <span class="holding-inscription">MUNDUS EVENTUS, NON RERUM</span>

    <div class="holding-logo">
      <img src="/images/EndlingSaga_Logo_v1_web.png" alt="The Endling Saga">
    </div>

    <div class="holding-line"></div>

    <p class="holding-status">— ENGINE BETWEEN STATES —</p>

    <p class="holding-sub">
      The Dead Machine is being rebuilt.<br>
      It will not look like it did before.<br>
      Return soon.
    </p>
  </div>
</div>

</body>
</html>
