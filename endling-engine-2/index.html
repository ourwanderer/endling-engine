<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Endling Saga. A world of happenings, not of things. Enter.">
  <meta name="og:title" content="The Endling Saga">
  <meta name="og:description" content="An Engine. All realities exist. You have found one.">
  <title>THE ENDLING SAGA</title>
  <link rel="stylesheet" href="css/engine.css">
  <style>
    /* Homepage specific */
    .homepage-bg {
      /* Replace 'images/east-to-engine.jpg' with your actual filename */
      background-image: url('/images/east-to-engine.jpg');
      filter: brightness(0.65) saturate(0.85);
    }

    /* Two-step homepage: first the approach (Image 1), then the door (engine5) */
    /* JavaScript handles the sequence below */

    .homepage .content {
      gap: 2.2rem;
    }

    .hp-inscription {
      font-family: var(--font-mono);
      font-size: clamp(0.5rem, 0.9vw, 0.65rem);
      letter-spacing: 0.4em;
      color: var(--dust);
      opacity: 0;
      animation: fadeIn 1.5s ease 0.4s forwards;
      text-transform: uppercase;
    }

    .hp-title {
      font-family: var(--font-display);
      font-size: clamp(3.5rem, 9vw, 8rem);
      letter-spacing: 0.1em;
      line-height: 0.88;
      color: var(--pale);
      opacity: 0;
      animation: fadeIn 1.2s ease 0.9s forwards;
      text-shadow:
        0 0 40px rgba(139, 26, 26, 0.4),
        0 0 120px rgba(139, 26, 26, 0.1);
    }

    .hp-sub {
      font-family: var(--font-prose);
      font-style: italic;
      font-size: clamp(0.85rem, 1.6vw, 1.05rem);
      color: var(--ghost);
      line-height: 1.75;
      max-width: 400px;
      opacity: 0;
      animation: fadeIn 1s ease 1.4s forwards;
    }

    .hp-divider {
      width: 40px;
      height: 1px;
      background: rgba(139,26,26,0.5);
      opacity: 0;
      animation: fadeIn 0.8s ease 1.7s forwards;
    }

    .hp-enter {
      opacity: 0;
      animation: fadeIn 1s ease 2s forwards;
    }

    /* Subtle bottom gradient to anchor nav */
    .engine-page::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 180px;
      background: linear-gradient(to top, rgba(10,6,8,0.9), transparent);
      z-index: 5;
      pointer-events: none;
    }

    /* What is this — very small, very quiet */
    .what-link {
      position: fixed;
      bottom: 1.2rem;
      right: 2rem;
      font-family: var(--font-mono);
      font-size: 0.5rem;
      letter-spacing: 0.25em;
      color: var(--dust);
      opacity: 0.2;
      text-decoration: none;
      text-transform: uppercase;
      z-index: 200;
      transition: opacity var(--transition-med);
      animation: fadeIn 1s ease 4s both;
    }

    .what-link:hover {
      opacity: 0.6;
    }
  </style>
</head>
<body>

<div id="page-transition" class="page-transition"></div>

<!-- Site logo top-left — links back home from any node -->
<div class="site-logo">
  <a href="index.html">
    <img src="/images/EndlingSaga_Logo_v1_web.png" alt="The Endling Saga">
  </a>
</div>

<!-- Main homepage -->
<main class="engine-page homepage">

  <!-- Background: Image 1 (East to the Engine) -->
  <!-- Upload your image as: images/east-to-engine.jpg -->
  <div class="bg-image vignette homepage-bg"></div>

  <div class="content">

    <span class="hp-inscription">MUNDUS EVENTUS, NON RERUM</span>

    <h1 class="hp-title">THE<br>ENDLING<br>SAGA</h1>

    <div class="hp-divider"></div>

    <p class="hp-sub">
      You have found an Engine.<br>
      It is not fully intact.
    </p>

    <a href="nodes/entry.html" class="enter-btn hp-enter"
       onclick="event.preventDefault(); navigateTo('nodes/entry.html')">
      ENTER
    </a>

  </div>

</main>

<!-- Hidden from casual visitors. For the persistent. -->
<a href="about.html" class="what-link">what is this?</a>

<script src="js/engine.js"></script>

</body>
</html>
