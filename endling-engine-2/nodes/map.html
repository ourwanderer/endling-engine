<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE ENDLING SAGA - THE MAP</title>
  <link rel="stylesheet" href="../css/engine.css">
<style>
.map-reset {
  position: fixed; top: 1.2rem; right: 1.5rem;
  font-family: var(--font-mono); font-size: 0.55rem;
  letter-spacing: 0.25em; color: var(--dust);
  opacity: 0.35; background: none; border: none;
  cursor: pointer; text-transform: uppercase;
  z-index: 200; transition: opacity 0.3s;
}
.map-reset:hover { opacity: 0.8; }
.node-nav { background: linear-gradient(to top, rgba(8,5,7,0.9) 0%, transparent 100%); padding: 1.5rem 0; }
</style>
<style>
  .map-hint {
    position: relative !important;
    top: auto !important; right: auto !important;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.55rem;
    letter-spacing: 0.3em;
    color: var(--dust);
    opacity: 0.4;
    padding: 1.5rem 0 0.8rem;
    z-index: 20;
  }
</style>
</head>
<body>
<div id="page-transition" class="page-transition"></div>
<div class="site-logo"><a href="../index.html"><img src="../images/misc/main-endling-saga-logo.png" alt="The Endling Saga"></a></div>

<p class="map-hint">drag to explore · scroll to zoom</p>
<div id="map-container" class="map-container">
  <img id="map-img" src="/images/hwr/hwr-map-of-the-continent-v1-large.jpg" alt="The Continent , Known Territories">
</div>



<nav class="node-nav">
  <button id="btn-back" class="nav-btn">← go back</button>
  <button id="btn-deeper" class="nav-btn deeper">go deeper →</button>
</nav>
<div class="coordinates" data-coords="THE CONTINENT - CARTOGRAPHIC SURVEY v1"></div>
<script src="../js/engine.js"></script>
<script>
  initMap();
// Reset button
document.getElementById('map-reset')?.addEventListener('click', () => {
  location.reload();
});
  initDeeperButton([
  { url: 'elayda.html', weight: 3 },
  { url: 'kelak.html', weight: 3 },
  { url: 'green-temple.html', weight: 2 },
  { url: 'gloss-sacred-lines.html', weight: 2 },
  { url: 'gloss-bria.html', weight: 2 },
  { url: 'vid-maelstrom-knight.html', weight: 2 },
  { url: 'img-kelak.html', weight: 2 },
  { url: 'img-dragon-rider.html', weight: 2 },
  { url: 'img-escape.html', weight: 1 },


]);
</script>
</body>
</html>
