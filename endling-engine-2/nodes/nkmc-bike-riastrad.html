    .bike-wrap {

      color: var(--engine-glow); opacity: 0.7;
      text-transform: uppercase;
    }
    .bike-desc {
      font-family: var(--font-prose); font-style: italic;
      font-size: clamp(0.85rem, 1.5vw, 0.98rem);
      line-height: 1.85; color: var(--ghost);
