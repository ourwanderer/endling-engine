<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/jpeg" href="/favicons/es-favicon-2.jpg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE ENDLING SAGA - AGNAR</title>
  <link rel="stylesheet" href="../css/engine.css">
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
    .glb-page { width:100vw; height:100vh; position:relative; background:#050303; }
    #glb-canvas { width:100%; height:100%; display:block; }
    .glb-label {
      position:fixed; bottom:5.5rem; left:50%; transform:translateX(-50%);
      font-family:var(--font-mono); font-size:0.5rem; letter-spacing:0.45em;
      color:var(--dust); opacity:0.25; text-transform:uppercase;
      pointer-events:none; z-index:50; white-space:nowrap;
    }
    .glb-hint {
      position:fixed; top:1.5rem; left:50%; transform:translateX(-50%);
      font-family:var(--font-mono); font-size:0.48rem; letter-spacing:0.3em;
      color:var(--dust); opacity:0.2; text-transform:uppercase;
      pointer-events:none; z-index:50;
      animation:fadeIn 1s ease 1.5s both, fadeOut 1s ease 5s forwards;
    }
    .glb-error {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      font-family:var(--font-mono); font-size:0.65rem; letter-spacing:0.2em;
      color:var(--dust); opacity:0.4; text-transform:uppercase; text-align:center;
      display:none;
    }
  </style>
</head>
<body>
<div id="page-transition" class="page-transition"></div>
<div class="site-logo"><a href="../index.html"><img src="../images/misc/main-endling-saga-logo.png" alt="The Endling Saga"></a></div>

<div class="glb-page">
  <canvas id="glb-canvas"></canvas>
  <div class="glb-error" id="glb-error">object could not be rendered</div>
</div>

<div class="glb-hint">drag to rotate · scroll to zoom</div>
<div class="glb-label">AGNAR</div>

<nav class="node-nav">
  <button id="btn-back" class="nav-btn">← go back</button>
  <button id="btn-deeper" class="nav-btn deeper">go deeper →</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="../js/engine.js"></script>
<script>
(function() {
  const canvas = document.getElementById('glb-canvas');
  const errorEl = document.getElementById('glb-error');

  // Scene setup
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050303);
  scene.fog = new THREE.Fog(0x050303, 8, 20);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.01, 100);
  camera.position.set(0, 1, 3);

  // Lighting - atmospheric
  const ambientLight = new THREE.AmbientLight(0xfff0e0, 0.4);
  scene.add(ambientLight);

  const keyLight = new THREE.DirectionalLight(0xffe8d0, 1.2);
  keyLight.position.set(2, 3, 2);
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x8b1a1a, 0.6);
  fillLight.position.set(-2, 1, -1);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xc0a080, 0.4);
  rimLight.position.set(0, -1, -3);
  scene.add(rimLight);

  // Controls
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 0.5;
  controls.maxDistance = 10;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.6;

  // Load GLB
  const loader = new THREE.GLTFLoader();
  loader.load(
    '/glb/agnar.glb',  // ← change this filename for different objects
    function(gltf) {
      const model = gltf.scene;

      // Centre and fit model
      const box = new THREE.Box3().setFromObject(model);
      const centre = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 2 / maxDim;

      model.position.sub(centre.multiplyScalar(scale));
      model.scale.setScalar(scale);

      scene.add(model);
      controls.autoRotate = true;
    },
    undefined,
    function(err) {
      console.error('GLB load error:', err);
      errorEl.style.display = 'block';
    }
  );

  // Render loop
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // Resize
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Stop auto-rotate on interaction
  canvas.addEventListener('pointerdown', () => { controls.autoRotate = false; });
})();

initDeeperButton([
  { url: 'koa.html',      weight: 3 },
  { url: 'leonard.html',  weight: 3 },
  { url: 'agnar.html',    weight: 2 },
  { url: 'vid-leonard-altar.html', weight: 2 },
  { url: 'gif-koa-ride.html', weight: 2 },


]);
</script>
</body>
</html>
