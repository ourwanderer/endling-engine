<script>
// Auto-detect video orientation
document.addEventListener('DOMContentLoaded', function() {
  var videoEl = document.querySelector('video');
  var container = document.querySelector('.video-player-container');
  if (!videoEl || !container) return;
  videoEl.addEventListener('loadedmetadata', function() {
    if (videoEl.videoHeight > videoEl.videoWidth) {
      container.className = 'video-player-container portrait';
    } else {
      container.className = 'video-player-container landscape';
    }
  });
});
</script>
