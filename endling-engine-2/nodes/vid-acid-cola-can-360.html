<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE ENDLING SAGA</title>
  <link rel="stylesheet" href="../css/engine.css">
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;}
    .vid-page{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000;position:relative;}
    .vid-label{position:fixed;top:1.2rem;left:50%;transform:translateX(-50%);font-family:var(--font-mono);font-size:0.5rem;letter-spacing:0.4em;color:rgba(184,160,144,0.25);text-transform:uppercase;z-index:10;pointer-events:none;}
    video{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;background:#000;}
    video::-webkit-media-controls-download-button{display:none!important;}
  </style>
</head>
<body>
<div id="page-transition" class="page-transition"></div>
<div class="site-logo"><a href="../index.html"><img src="../images/misc/main-endling-saga-logo.png" alt="The Endling Saga"></a></div>
<div class="vid-page">
  <span class="vid-label">ACID COLA — 360</span>
  
  <video controls controlsList="nodownload" preload="metadata" playsinline>
    <source src="/video/endling/acid-cola-can-360.mp4" type="video/mp4">
  </video>
</div>
<nav class="node-nav">
  <button id="btn-back" class="nav-btn">← go back</button>
  <button id="btn-deeper" class="nav-btn deeper">go deeper →</button>
</nav>
<script src="../js/engine.js"></script>
<script>
initDeeperButton([
  { url: 'entry.html', weight: 2 },
  { url: 'koa.html', weight: 2 },
  { url: 'leonard.html', weight: 2 },
  { url: 'domum-novum.html', weight: 1 },
  { url: 'the-continent.html', weight: 1 },
]);
// Auto-detect orientation
document.addEventListener('DOMContentLoaded', function() {
  var v = document.querySelector('video');
  if (!v) return;
  v.addEventListener('loadedmetadata', function() {
    if (v.videoHeight > v.videoWidth) {
      v.style.maxWidth = 'min(360px, 100vw)';
      v.style.maxHeight = '100vh';
    }
  });
});
</script>
</body>
</html>
